[tox]
envlist =
    ; Django 5.2 + supported Wagtail versions
    py{310,311,312,313}-django52-wagtail{70,74}-{sqlite,postgres}
    py314-django52-wagtail74-{sqlite,postgres}
    ; Django 6.0 + supported Wagtail versions
    py{312,313,314}-django60-wagtail{74,80}-{sqlite,postgres}
    ; Django 6.1 + supported Wagtail versions
    py{312,313,314}-django61-wagtail80-{sqlite,postgres}

[testenv]
allowlist_externals = coverage
commands = coverage run -p testmanage.py test --deprecation all --noinput
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14

deps =
    coverage
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2

    wagtail70: wagtail~=7.0.0
    wagtail73: wagtail~=7.3.0
    wagtail74: wagtail~=7.4.0
    wagtail80: wagtail~=8.0.0rc1

    future: git+https://github.com/wagtail/wagtail.git@main#egg=Wagtail
    future: git+https://github.com/django/django.git@main#egg=Django

    postgres: psycopg2>=2.9
extras = testing
commands_pre =
    ; Install latest django-ninja from GitHub, due to dependency resolution problem
    ; See https://github.com/vitalik/django-ninja/pull/1749
    future: pip install --no-deps https://github.com/vitalik/django-ninja/archive/refs/heads/master.zip
    django61: pip install --no-deps https://github.com/vitalik/django-ninja/archive/refs/heads/master.zip
setenv =
    postgres: DATABASE_URL={env:DATABASE_URL:postgres:///wagtail_ab_testing}
